{% extends "base.html" %}
    {% block title %}
        Contact Form
    {% endblock %}
    {% block content %}
        <link rel="stylesheet" href="{{ url_for('static', filename='home_page.css') }}">

        <h1>Contact Us</h1>

        <p>
            Any questions or comments? Please let us know! Fill out the form below.
        </p>

        <form class="contact_form" action="/contact" method="post">

             <label class="large-label" for="name">Name:</label><br>
             <input type="text" id="name" name="name" required>
               <br>
             <label class="large-label" for="email">Email:</label><br>
             <input type="text" id="email" name="email" required>
                <br>
             <label class="large-label" for="message">Message:</label><br>
             <textarea id="message" name="message" required></textarea>
               <button name="button" id="button">Submit</button>
        </form>

    {% endblock %}

    {% block footer %}
        <footer>
            <div class="footer-container">
                <div class="footer-column">
                    <ul>
                        <li><a href="{{ url_for('home_pagina') }}">Home</a></li>
                        <li><a href="{{ url_for('dynamische_about_pagina') }}">About</a></li>
                        <li><a href="{{ url_for('tool_gebruiken') }}">Tool</a></li>
                        <li><a href="{{ url_for('contact_pagina') }}">Contact</a></li>
                    </ul>
                </div>
            </div>
        </footer>
    {% endblock %}
